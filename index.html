<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDT-1: Secure Share</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #3b82f6;
            --green: #22c55e;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%; 
            max-width: 480px; 
            background: var(--bg);
        }
        
        /* LOGIN SCREEN */
        #login-screen {
            text-align: center;
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        input[type="text"] {
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            margin: 20px 0;
            font-size: 1.1em;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        /* DASHBOARD (HIDDEN INITIALLY) */
        #dashboard { display: none; }

        .header { text-align: center; margin-bottom: 30px; }
        .my-id-badge {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 1.2em;
            color: var(--accent);
            display: inline-block;
            margin-top: 10px;
        }

        /* RADAR ZONE */
        .radar-zone {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            min-height: 250px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid var(--border);
            position: relative;
        }
        .radar-pulse {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { width: 20px; height: 20px; opacity: 0.8; }
            100% { width: 250px; height: 250px; opacity: 0; }
        }

        /* PEER LIST */
        .peer-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .peer-item {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .peer-item:hover {
            border-color: var(--accent);
            background: #475569;
        }
        .peer-avatar {
            width: 45px; height: 45px;
            background: var(--green);
            border-radius: 50%;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0f172a;
            font-size: 1.2em;
        }

        #file-input { display: none; }
        
        .logs {
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #94a3b8;
            background: #000;
            padding: 10px;
            border-radius: 8px;
            height: 120px;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        
        .status-msg {
            margin-top: 10px;
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="login-screen">
        <h1>LDT-1 Share</h1>
        <p style="color:#94a3b8">Secure Local File Transfer</p>
        <input type="text" id="username-input" placeholder="Enter a Username" />
        <button onclick="login()">Enter Network</button>
    </div>

    <div id="dashboard">
        <div class="header">
            <div>Your Permanent ID</div>
            <div class="my-id-badge" id="my-address">...</div>
        </div>

        <div class="radar-zone">
            <div class="radar-pulse"></div>
            <h3>Nearby Users</h3>
            <p style="color:#94a3b8; font-size: 0.9em;">Click a user to send a file</p>
            
            <ul class="peer-list" id="peer-list">
                </ul>
            <div id="status-display" class="status-msg">Scanning...</div>
        </div>

        <input type="file" id="file-input" />

        <div class="logs" id="console">
            <div>> System Ready. Waiting for login...</div>
        </div>
        
        <button onclick="logout()" style="margin-top:20px; background:#ef4444;">Logout</button>
    </div>
</div>

<script>
    // --- GLOBAL STATE ---
    let myID = null;
    let peerConnection = null;
    let dataChannel = null;
    let incomingChunks = [];
    const peers = new Set();
    const network = new BroadcastChannel('ldt_airdrop_v2');

    // --- 1. LOGIN SYSTEM ---
    
    // Check localStorage on load
    const savedID = localStorage.getItem('ldt_username');
    if (savedID) {
        myID = savedID;
        showDashboard();
    }

    function login() {
        const input = document.getElementById('username-input').value.trim();
        if (!input) return alert("Please enter a username");
        
        myID = input;
        localStorage.setItem('ldt_username', myID); // Save permanently
        showDashboard();
    }

    function logout() {
        localStorage.removeItem('ldt_username');
        location.reload();
    }

    function showDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('my-address').innerText = myID;
        log(`Logged in as: ${myID}`);
        startDiscovery();
    }

    // --- 2. DISCOVERY (RADAR) ---
    
    function startDiscovery() {
        // Announce presence immediately & periodically
        const announce = () => network.postMessage({ type: 'presence', id: myID });
        announce();
        setInterval(announce, 3000);

        // Listen for others
        network.onmessage = (event) => {
            const data = event.data;
            if (data.id === myID) return; // Ignore self

            // A. Discovery
            if (data.type === 'presence') {
                if (!peers.has(data.id)) {
                    peers.add(data.id);
                    renderPeer(data.id);
                    log(`New User Found: ${data.id}`);
                }
            }
            
            // B. Signaling (WebRTC Handshake)
            if (data.target === myID) {
                handleSignal(data);
            }
        };
    }

    function renderPeer(peerID) {
        document.getElementById('status-display').innerText = "Users found";
        const list = document.getElementById('peer-list');
        const li = document.createElement('li');
        li.className = 'peer-item';
        li.innerHTML = `
            <div class="peer-avatar">${peerID.charAt(0).toUpperCase()}</div>
            <div>${peerID}</div>
        `;
        li.onclick = () => initiateSend(peerID);
        list.appendChild(li);
    }

    // --- 3. SENDING LOGIC ---
    let targetPeer = null;

    function initiateSend(receiverID) {
        targetPeer = receiverID;
        document.getElementById('file-input').click();
    }

    document.getElementById('file-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        log(`preparing to send ${file.name} to ${targetPeer}...`);
        
        // Setup Sender PeerConnection
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        peerConnection = new RTCPeerConnection(config);

        // Create Data Channel
        dataChannel = peerConnection.createDataChannel("file-transfer");
        dataChannel.onopen = () => sendFileRaw(file);

        // ICE Handling
        peerConnection.onicecandidate = event => {
            if (event.candidate) sendSignal(targetPeer, 'ice', event.candidate);
        };

        // Create Offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        sendSignal(targetPeer, 'offer', offer);
    };

    function sendFileRaw(file) {
        log(`🚀 Sending ${file.name}...`);
        document.getElementById('status-display').innerText = "Sending...";
        
        const reader = new FileReader();
        reader.onload = (e) => {
            const buffer = e.target.result;
            const CHUNK_SIZE = 16384; // 16KB
            
            for(let i=0; i<buffer.byteLength; i+=CHUNK_SIZE) {
                dataChannel.send(buffer.slice(i, i+CHUNK_SIZE));
            }
            dataChannel.send('EOF'); // End Marker
            log(`✅ File Sent Successfully!`);
            document.getElementById('status-display').innerText = "Sent!";
            setTimeout(() => document.getElementById('status-display').innerText = "Scanning...", 2000);
        };
        reader.readAsArrayBuffer(file);
    }

    // --- 4. RECEIVING LOGIC ---
    
    async function handleSignal(data) {
        // Initialize Receiver PC if not exists
        if (!peerConnection || peerConnection.signalingState === 'closed') {
            const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
            peerConnection = new RTCPeerConnection(config);
            
            peerConnection.onicecandidate = event => {
                if (event.candidate) sendSignal(data.sender, 'ice', event.candidate);
            };

            peerConnection.ondatachannel = event => {
                log(`⚡ Connection from ${data.sender}`);
                document.getElementById('status-display').innerText = `Receiving from ${data.sender}...`;
                const channel = event.channel;
                channel.onmessage = handleIncomingData;
            };
        }

        if (data.type === 'offer') {
            log(`📥 Incoming Offer from ${data.sender}`);
            await peerConnection.setRemoteDescription(data.payload);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            sendSignal(data.sender, 'answer', answer);
        } 
        else if (data.type === 'answer') {
            await peerConnection.setRemoteDescription(data.payload);
        } 
        else if (data.type === 'ice') {
            await peerConnection.addIceCandidate(data.payload);
        }
    }

    function handleIncomingData(event) {
        if (event.data === 'EOF') {
            log(`💾 File Complete. Downloading...`);
            document.getElementById('status-display').innerText = "File Received!";
            
            const blob = new Blob(incomingChunks);
            const url = URL.createObjectURL(blob);
            
            // Auto-trigger download
            const a = document.createElement('a');
            a.href = url;
            a.download = `received_${Date.now()}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            incomingChunks = []; // Reset buffer
            setTimeout(() => document.getElementById('status-display').innerText = "Scanning...", 3000);
        } else {
            incomingChunks.push(event.data);
        }
    }

    // --- HELPERS ---
    
    function sendSignal(target, type, payload) {
        network.postMessage({
            target: target,
            sender: myID,
            type: type,
            payload: payload
        });
    }

    function log(msg) {
        const consoleDiv = document.getElementById('console');
        const time = new Date().toLocaleTimeString();
        consoleDiv.innerHTML += `<div><span style="color:#64748b">[${time}]</span> ${msg}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

</script>

</body>
</html>
