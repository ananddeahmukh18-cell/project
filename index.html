<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDT-1: Secure AirDrop</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #3b82f6;
            --green: #22c55e;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 500px; }
        
        /* LOGIN / HEADER */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .my-id-badge {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 1.1em;
            color: var(--accent);
            display: inline-block;
            margin-top: 10px;
        }

        /* RADAR (USER DISCOVERY) */
        .radar-zone {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            min-height: 200px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .radar-pulse {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            animation: pulse 2s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { width: 50px; height: 50px; opacity: 0.8; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }

        /* PEER LIST */
        .peer-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .peer-item {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .peer-item:hover {
            border-color: var(--accent);
            background: #475569;
        }
        .peer-avatar {
            width: 40px; height: 40px;
            background: var(--green);
            border-radius: 50%;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: black;
        }

        /* FILE INPUT (HIDDEN INITIALLY) */
        #file-input { display: none; }
        
        /* LOGS */
        .logs {
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #94a3b8;
            width: 100%;
            text-align: left;
            height: 100px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LDT-1 Secure Share</h1>
        <div>Your Permanent ID:</div>
        <div class="my-id-badge" id="my-address">Loading...</div>
    </div>

    <div class="radar-zone">
        <div class="radar-pulse"></div>
        <h3>Nearby Devices</h3>
        <p style="color:#94a3b8; font-size: 0.9em;">Tap a user to send a file</p>
        
        <ul class="peer-list" id="peer-list">
            </ul>
        
        <div id="loading-msg">Scanning...</div>
    </div>

    <input type="file" id="file-input" />

    <div class="logs" id="console">
        <div>> System Initialized</div>
    </div>
</div>

<script>
    // --- 1. IDENTITY & PERSISTENCE ---
    // Check if user has an address, if not generate and save it
    let myID = localStorage.getItem('ldt_user_id');
    if (!myID) {
        // Generate a random 6-char hex ID
        myID = 'User-' + Math.floor(Math.random()*16777215).toString(16).toUpperCase();
        localStorage.setItem('ldt_user_id', myID);
    }
    document.getElementById('my-address').innerText = myID;

    // --- 2. DISCOVERY (BROADCAST CHANNEL) ---
    // Simulates "Local Network" discovery like AirDrop
    const network = new BroadcastChannel('ldt_airdrop_net');
    const peers = new Set(); // Stores online users

    // Announce myself every 3 seconds
    setInterval(() => {
        network.postMessage({ type: 'presence', id: myID });
    }, 3000);
    // Announce immediately on load
    network.postMessage({ type: 'presence', id: myID });

    // Listen for others
    network.onmessage = (event) => {
        const data = event.data;
        
        // 1. PRESENCE (Discovery)
        if (data.type === 'presence' && data.id !== myID) {
            if (!peers.has(data.id)) {
                peers.add(data.id);
                renderPeer(data.id);
                log(`Found peer: ${data.id}`);
            }
        }
        
        // 2. SIGNALING (WebRTC Handshake)
        if (data.target === myID) {
            handleSignal(data);
        }
    };

    function renderPeer(peerID) {
        document.getElementById('loading-msg').style.display = 'none';
        const list = document.getElementById('peer-list');
        
        const li = document.createElement('li');
        li.className = 'peer-item';
        li.innerHTML = `
            <div class="peer-avatar">${peerID.substring(5,7)}</div>
            <div>${peerID}</div>
        `;
        li.onclick = () => selectFileAndSend(peerID);
        list.appendChild(li);
    }

    // --- 3. SENDING LOGIC ---
    let targetPeer = null;
    let peerConnection = null;
    let dataChannel = null;

    function selectFileAndSend(receiverID) {
        targetPeer = receiverID;
        document.getElementById('file-input').click(); // Trigger file picker
    }

    document.getElementById('file-input').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        log(`Preparing to send ${file.name} to ${targetPeer}...`);
        
        // A. Create Peer Connection
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        peerConnection = new RTCPeerConnection(config);

        // B. Setup Data Channel
        dataChannel = peerConnection.createDataChannel("file-transfer");
        dataChannel.onopen = () => sendFile(file);

        // C. ICE Candidates
        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                sendSignal(targetPeer, 'ice', event.candidate);
            }
        };

        // D. Create Offer
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        sendSignal(targetPeer, 'offer', offer);
    };

    function sendFile(file) {
        log(`🚀 Sending data...`);
        const reader = new FileReader();
        reader.onload = (e) => {
            const buffer = e.target.result;
            const CHUNK_SIZE = 16384;
            
            // Send in chunks
            for(let i=0; i<buffer.byteLength; i+=CHUNK_SIZE) {
                dataChannel.send(buffer.slice(i, i+CHUNK_SIZE));
            }
            dataChannel.send('EOF'); // End of file marker
            log(`✅ File Sent Successfully!`);
        };
        reader.readAsArrayBuffer(file);
    }

    // --- 4. RECEIVING LOGIC ---
    let incomingChunks = [];

    async function handleSignal(data) {
        if (!peerConnection) {
            // Initialize Receiver
            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            
            peerConnection.onicecandidate = event => {
                if (event.candidate) sendSignal(data.sender, 'ice', event.candidate);
            };

            peerConnection.ondatachannel = event => {
                const channel = event.channel;
                channel.onmessage = handleData;
                log(`⚡ Connection established with ${data.sender}`);
            };
        }

        if (data.type === 'offer') {
            log(`📥 Incoming request from ${data.sender}...`);
            await peerConnection.setRemoteDescription(data.payload);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            sendSignal(data.sender, 'answer', answer);
        } 
        else if (data.type === 'answer') {
            await peerConnection.setRemoteDescription(data.payload);
        } 
        else if (data.type === 'ice') {
            await peerConnection.addIceCandidate(data.payload);
        }
    }

    function handleData(event) {
        if (event.data === 'EOF') {
            log(`💾 File Received! Downloading...`);
            const blob = new Blob(incomingChunks);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `received_from_${Date.now()}`;
            a.click();
            incomingChunks = []; // Reset
        } else {
            incomingChunks.push(event.data);
        }
    }

    // --- HELPERS ---
    function sendSignal(target, type, payload) {
        network.postMessage({
            target: target,
            sender: myID,
            type: type,
            payload: payload
        });
    }

    function log(msg) {
        const consoleDiv = document.getElementById('console');
        consoleDiv.innerHTML += `<div>> ${msg}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }
</script>

</body>
</html>
